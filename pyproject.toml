[project]
name = "rsae"
version = "0.1.0"
description = "Identifiable Sparse Autoencoders using overcomplete library"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21.0",
    "matplotlib>=3.5.0",
    "scipy>=1.7.0",
    "overcomplete>=0.1.0",
    "hydra-core>=1.3.2",
    "hydra-submitit-launcher>=1.2.0",
    "mlflow>=2.10.0",
    "torch>=2.5.1",
    "pyyaml>=6.0.3",
    "ipdb>=0.13.13",
    "huggingface_hub>=0.19.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "scikit-learn>=1.3.0",
    "transformer-lens>=2.15.4",
    "datasets>=2.14.4,<4.0.0",
    "zstandard>=0.23.0",
    "nnsight>=0.3.0,<0.4.0",
    "sae-lens>=6.22.3",
    "tabulate==0.9.0",
    "openai>=2.9.0",
    "hydra-joblib-launcher>=1.2.0",
    "sae-probes>=0.3.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=6.0",
    "black>=22.0",
    "flake8>=4.0",
]

[tool.setuptools]
packages = ["rsae"]
