# Transformer experiment configuration
# Training SAEs on pre-computed transformer activations using dictionary_learning

# MLflow configuration
mlflow:
  enabled: true  # Always enabled (non-optional)
  experiment_name: transformer-sae-experiments
  tracking_uri: ./mlruns
  log_frequency: 100  # Log metrics every N steps
  log_artifacts: true  # Save model checkpoints to MLflow
  checkpoint_interval: 5000  # Log checkpoint to MLflow every N steps (null = disabled)

# Output and caching
output:
  dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  cache_dir: .cache/models
  use_cache: false

# Data caching (for activation buffers)
data_cache:
  use_cache: false
  cache_dir: null  # null = default HuggingFace cache location

# Device configuration
device:
  use_gpu: true
  gpu_id: 0

# Seeds
seed:
  data: 42   # Random seed for ActivationBuffer sampling
  train: 0   # Random seed for model initialization and training (will be overridden by sweep)
  split: 42  # Random seed for train/val split (ensures reproducibility)

# Default configurations - compose experiment from these
defaults:
  - model: topk_isae
  - data: transformer
  - training: default
  - _self_

# Experiment metadata
experiment:
  name: transformer-identifiability
  notes: "Training SAEs on transformer activations for identifiability assessment"
  group: null
  job_type: train
  tags: transformer,real_data,identifiability
